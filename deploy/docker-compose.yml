# Stagecue self-hosted stack (pulls from GitHub Container Registry).
#
# Quick start:
#   curl -O https://raw.githubusercontent.com/expertslive/stagecue/main/deploy/docker-compose.yml
#   curl -O https://raw.githubusercontent.com/expertslive/stagecue/main/deploy/.env.example
#   mv .env.example .env && $EDITOR .env
#   docker compose up -d
#
# See deploy/README.md for the full guide.

services:
  app:
    image: ghcr.io/expertslive/stagecue:${STAGECUE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=db,1433;Database=EventStageTimer;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=true"
      Database__AutoMigrate: "true"
      Storage__Mode: "Local"
      Storage__Local__Root: "/app/uploads"
      Auth__Mode: "Password"
      App__BaseUrl: "${APP_BASE_URL:-http://localhost:8080}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 12
      start_period: 30s

volumes:
  uploads:
  sqldata:
