name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      # --- .NET ---
      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build --no-restore --nologo --configuration Release

      # Integration tests use Testcontainers to spin up SQL Server in Docker.
      # ubuntu-latest runners have Docker preinstalled.
      - name: dotnet test
        run: dotnet test --no-build --nologo --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      # --- Web ---
      - name: npm ci
        working-directory: src/web
        run: npm ci

      - name: typecheck web
        working-directory: src/web
        run: npx tsc --noEmit

      - name: vitest
        working-directory: src/web
        run: npm test -- --run
