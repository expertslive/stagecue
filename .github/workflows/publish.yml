name: publish-image

# Build and push the Stagecue container image to GitHub Container Registry.
#
# Triggers:
#   - Push to main           -> :edge plus :sha-<short>
#   - Push of a `v*.*.*` tag -> :<version>, :<major>.<minor>, :<major>, :latest, :sha-<short>
#   - Manual run             -> :edge plus :sha-<short> (useful for testing the pipeline)
#
# The image is multi-arch (linux/amd64 + linux/arm64) so it runs on Intel
# servers, ARM cloud hosts, and Apple-silicon dev boxes.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Only one publish per ref runs at a time; don't cancel an in-flight push
# (multi-arch builds are expensive — we'd rather queue than waste them).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build + push
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # QEMU lets the amd64 runner emulate arm64 during the build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase the repository name — GHCR rejects uppercase image refs but
      # GitHub repos may contain capitals.
      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # Tag scheme:
          #   - `edge` follows the default branch (main).
          #   - On a v1.2.3 tag, emit 1.2.3, 1.2, 1, and move `latest`.
          #   - Always emit `sha-<short>` so anyone can pin to a specific commit.
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-Actions cache backend: persists across runs without manual
          # cache key bookkeeping. `mode=max` caches every intermediate layer.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Surface the source repo on the package page on GHCR.
          provenance: true
